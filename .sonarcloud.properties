# Static HTML pages intentionally repeat shared navigation and footer markup.
# Keep SonarCloud's code analysis enabled, but do not score that page-shell
# markup as duplicated implementation code.
sonar.cpd.exclusions=**/*.html

# The real estate demo commits compiled Tailwind CSS and esbuild bundles (including
# third-party Motion, Lenis and Three.js). Analyse its sources in real-estate/src instead.
sonar.exclusions=real-estate/js/**,real-estate/css/**
